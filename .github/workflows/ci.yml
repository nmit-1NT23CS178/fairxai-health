name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt
      - name: Verify shipped model artifacts load and predict
        run: python scripts/verify_artifacts.py
      - name: Run test suite
        run: python -m pytest -q
